services:
  kasm-tipp10-test:
    build:
      context: .
      args:
        BASE_TAG: "latest"
        BASE_IMAGE: "kasm-core-ubuntu"
    image: teacherki/kasm-tipp10:latest
    container_name: kasm-tipp10-test
    hostname: kasm-tipp10
    
    # Ports - VNC and Audio
    ports:
      - "6901:6901"   # VNC Web Interface (HTTPS)
      - "4901:4901"   # Audio WebSocket
    
    # Environment variables matching production setup
    environment:
      - VNC_PW=password
      - USER=testuser
      - START_PULSEAUDIO=1
      - ISERV_PROFILE_SYNC=1
      - ISERV_SYNC_INTERVAL=30
      - LANG=de_DE.UTF-8
      - LANGUAGE=de_DE:de
      - LC_ALL=de_DE.UTF-8
    
    # Volumes matching production setup from docker_manager.py
    volumes:
      # User private files (shared across all desktop types)
      - ./test-volumes/user-private:/home/kasm-user-private:rw
      # Desktop-type-specific configs (.config, .cache, etc.)
      - ./test-volumes/user-configs:/home/kasm-user-configs:rw
      # Shared public directory
      - ./test-volumes/shared-public:/home/kasm-user/Public/shared:rw
    
    # Resource limits
    shm_size: 512m
    
    # Startup command matching production (merges volumes into /home/kasm-user)
    entrypoint:
      - /bin/bash
      - -c
      - |
        # Merge private user space into home directory (shared across all containers)
        if [ -d /home/kasm-user-private ]; then
          cp -a /home/kasm-user-private/. /home/kasm-user/ 2>/dev/null || true
        fi
        # Overlay desktop-type-specific configs on top (without overwriting private files)
        if [ -d /home/kasm-user-configs ]; then
          cp -an /home/kasm-user-configs/. /home/kasm-user/ 2>/dev/null || true
        fi
        # Execute original entrypoint
        exec /dockerstartup/kasm_default_profile.sh /dockerstartup/vnc_startup.sh
    
    # Keep container running
    restart: unless-stopped
    
    # Labels for identification
    labels:
      - "managed_by=iserv-remote-desktop"
      - "desktop_type=tipp10"
      - "test=true"

# Note: The test-volumes directories will be created automatically
# Structure:
# - test-volumes/user-private/    → User's private files (Desktop, Documents, etc.)
# - test-volumes/user-configs/    → Tipp10-specific configs (.config, .cache, etc.)
# - test-volumes/shared-public/   → Shared public files
